name: Prepare reviewed core tree
on:
  pull_request:
    branches: [main]
    paths: ['.reviewed-core/**', '.github/workflows/prepare-reviewed-core.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 108 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/verified-read-answers'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify reviewed source (no workflow or ref writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request, urllib.error
          base = '66c56b1d1963599ee1a6198fd6f22c95e03f8d2b'
          expected = '51d3d1189a82fcc412131e1f7ee5f4b88d57a573'
          expected_patch = '216975b191ecb11501bdda1d362c9210c0920ac088806eb5e099ca4cc2ef7d7f'
          first = base64.b64encode(pathlib.Path('.reviewed-core/part1.bin').read_bytes()).decode()
          assert len(first) == 8300 and first[561:562] == 't' and first[4084:4086] == '5q'
          first = first + 'K'
          first = first[:4084] + 'QX' + first[4086:]
          first = first[:561] + first[562:]
          packed = base64.b64decode(first) + b''.join(pathlib.Path(f'.reviewed-core/part{i}.bin').read_bytes() for i in (2,3))
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == expected_patch, 'Reviewed patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          allowed = {'.github/workflows/read-authority-eval.yml', 'src/agent/contracts/foreground-turn-schema.js', 'src/agent/contracts/intent-contracts.js', 'src/agent/contracts/read-answer.js', 'src/agent/core/agent-core.js', 'src/agent/core/execution-facts.js', 'src/agent/core/presentation-policy.js', 'src/agent/core/read-answer.js', 'src/agent/orchestration/intent-executor.js', 'src/agent/orchestration/router-core.js', 'src/agent/tools/task-read.js', 'src/features/tasks/service.js', 'tests/unit/agent/agent-core-overview.test.js', 'tests/unit/agent/read-answer.test.js', 'tests/unit/agent/router-native-orchestration.test.js', 'tests/unit/agent/task-read-coverage.test.js'}
          assert set(paths) == allowed, 'Unexpected changed paths'
          # Workflow changes are applied separately through the authorized connector.
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(p).read_text()} for p in paths if not p.startswith('.github/')]
          request = urllib.request.Request('https://api.github.com/repos/Harvey1419/FiveLabs-Reminder/git/trees', data=json.dumps({'base_tree':base, 'tree':entries}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', 'User-Agent':'reviewed-source-verification'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print('Git object preparation denied:', error.code, error.read().decode())
              raise
          assert result['sha'] == expected, 'Prepared tree differs from locally tested source'
          print('PREPARED_CODE_TREE_SHA='+result['sha'])
          print('No branch refs, workflow files, production data or deployment settings were written.')
          PY

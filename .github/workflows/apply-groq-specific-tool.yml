name: Apply Groq Specific Tool Patch

on:
  push:
    branches: [fix/groq-specific-execute-turn]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-specific-execute-turn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch provider policy and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('src/agent/providers/client.js')
          text = client.read_text()
          old = """      parallelToolCalls: undefined,\n      // Keep one retry only for a malformed/empty structured response. Provider\n      // finish errors skip immediately to the independent fallback below.\n      emptyContentRetries: 1,"""
          new = """      parallelToolCalls: undefined,\n      // GPT-OSS/Groq is most reliable when the only canonical foreground tool is\n      // selected explicitly instead of using generic `required`. Hermes still\n      // validates that execute_turn is actually returned before accepting output.\n      requiredToolName: 'execute_turn',\n      // Keep one retry only for a malformed/empty structured response. Provider\n      // finish errors skip immediately to the independent fallback below.\n      emptyContentRetries: 1,"""
          if old not in text:
              raise SystemExit('primary profile anchor not found')
          text = text.replace(old, new, 1)

          old = """    const effectiveToolChoice = toolChoice === 'required' && profile.requiredToolChoiceSupported === false\n      ? 'auto'\n      : toolChoice;"""
          new = """    const hasRequiredNamedTool = toolChoice === 'required'\n      && profile.requiredToolName\n      && tools?.some((item) => item?.function?.name === profile.requiredToolName);\n    const effectiveToolChoice = hasRequiredNamedTool\n      ? { type: 'function', function: { name: profile.requiredToolName } }\n      : toolChoice === 'required' && profile.requiredToolChoiceSupported === false\n        ? 'auto'\n        : toolChoice;"""
          if old not in text:
              raise SystemExit('effective tool-choice anchor not found')
          client.write_text(text.replace(old, new, 1))

          test = Path('tests/unit/agent/provider-latency-regressions.test.js')
          text = test.read_text()
          anchor = """    expect(payloads[0].provider.only).toEqual(['groq']);\n    expect(payloads[1].provider.only).toEqual(['baseten/fp8']);"""
          replacement = """    expect(payloads[0].provider.only).toEqual(['groq']);\n    expect(payloads[0].tool_choice).toEqual({\n      type: 'function',\n      function: { name: 'execute_turn' },\n    });\n    expect(payloads[1].provider.only).toEqual(['baseten/fp8']);"""
          if anchor not in text:
              raise SystemExit('provider regression anchor not found')
          test.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check syntax
        run: node --check src/agent/providers/client.js
      - name: Run provider regressions
        run: pnpm vitest run --config tests/config/vitest.unit.js tests/unit/agent/provider-latency-regressions.test.js tests/unit/agent/openrouter-multimodal.test.js
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-groq-specific-tool.yml
          git config user.name 'Hermes CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/agent/providers/client.js tests/unit/agent/provider-latency-regressions.test.js .github/workflows/apply-groq-specific-tool.yml
          git commit -m 'fix: force execute_turn specifically on Groq primary'
          git push origin HEAD:fix/groq-specific-execute-turn

name: Apply Structured TurnIntent
on:
  push:
    branches: [fix/groq-structured-turnintent]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      KAPSO_API_KEY: test-kapso-key
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply migration
        run: python3 scripts/migrate-structured-turn.py
      - run: npm install --global pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          find src scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          pnpm run test:unit
      - name: Commit
        run: |
          git config user.name 'Hermes CI'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/apply-structured-turnintent.yml scripts/migrate-structured-turn.py
          git add -A
          git commit -m 'fix: use strict structured TurnIntent output'
          git push origin HEAD:fix/groq-structured-turnintent

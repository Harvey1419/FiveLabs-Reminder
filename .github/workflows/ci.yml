name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAPSO_API_KEY: test-kapso-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce zero maintained JavaScript
        run: pnpm run migration:check

      - name: Review remaining V1 runtime caller inventory
        run: pnpm run inventory:v1

      - name: Build and typecheck TypeScript packages and tests
        run: pnpm run typecheck

      - name: Enforce V2 domain independence from V1 dispatch
        run: pnpm run check:v2-boundary

      - name: Lint TypeScript syntax and safety
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Verify durable conversation and legacy continuity offline
        run: pnpm run test:conversation

      - name: Compare V2 context capacity and multi-action completion offline
        run: pnpm run eval:context-budgets > context-budget-comparison.log

      - name: Verify compiled ESM package imports
        run: node --input-type=module -e 'await import("./packages/agent-core/dist/index.js"); await import("./packages/ai/dist/index.js"); await import("./dist/runtime/jobs/inbound-turn-worker.js"); await import("./dist/runtime/agent/core/active-run-executor.js"); await import("./dist/runtime/agent/core/active-run-lifecycle.js")'

      - name: Build production container
        run: docker build -t hermes-ci:${{ github.sha }} .

      - name: Verify container startup, health and graceful shutdown offline
        run: pnpm run smoke:container hermes-ci:${{ github.sha }}

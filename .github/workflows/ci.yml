name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAPSO_API_KEY: test-kapso-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check source syntax
        shell: bash
        run: find src scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck TypeScript packages and tests
        run: pnpm run typecheck

      - name: Lint TypeScript syntax and safety
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Verify durable conversation integration offline
        run: pnpm run test:conversation

      - name: Verify compiled ESM package imports
        run: node --input-type=module -e 'await import("./packages/agent-core/dist/index.js"); await import("./packages/ai/dist/index.js"); await import("./dist/runtime/jobs/inbound-turn-worker.js"); await import("./dist/runtime/agent/core/active-run-executor.js"); await import("./dist/runtime/agent/core/active-run-lifecycle.js")'
